name: Fraud Detection Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Regression & Evaluation Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite
        run: |
          pytest -v tests/

      - name: Run Model Evaluation Regression Check
        run: |
          python eval/eval_model.py --max-rows 5000 --threshold 0.38

      - name: Run Agent Evaluation Benchmark Check
        run: |
          python eval/eval_agent.py

      - name: Run Disparate Impact & Fairness Audit Check
        run: |
          python governance/run_fairness_audit.py --max-rows 5000 --threshold 0.38

      - name: Archive Scorecards and Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-and-evaluation-reports
          path: |
            reports/
            governance/
